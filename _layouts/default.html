<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav aria-label="Main">
        {% for item in site.nav %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
      </nav>
    </header>

    <main>
      {% if page.title and page.layout != "home" %}<h1 class="page-title">{{ page.title }}</h1>{% endif %}
      {{ content }}
    </main>

    <footer class="site-footer">
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      <span>Updated {{ site.time | date: "%B %Y" }}</span>
    </footer>
  </div>
</body>
</html>
